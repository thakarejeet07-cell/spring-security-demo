spring.application.name=spring-security-demo

logging.level.org.springframework.security=DEBUG
#spring.security.user.name=jeet
#spring.security.user.password=jeet123

server.servlet.session.cookie.same-site=strict

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:securitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console (lets you view the tables in the browser)
spring.h2.console.enabled=true